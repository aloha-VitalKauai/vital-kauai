<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vital Kauaʻi PWA maskable icon. The maskable spec reserves the outer
  20% of each edge as a "safe zone" the OS may crop. Glyph stays inside
  the central 60% so it survives Android's circular / squircle masks.
  Same palette + glyph as icon-512.svg, just scaled down.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vital Kauaʻi">
  <rect width="512" height="512" fill="#1C2B1E"/>
  <text
    x="256"
    y="320"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="200"
    font-weight="300"
    fill="#F5F0E8"
    text-anchor="middle"
  >V</text>
</svg>
